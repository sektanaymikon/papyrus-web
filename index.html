<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNDERTALE but everyone is Papyrus</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font:16px Arial,sans-serif}body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px}button,a{color:#fff}button{background:#171717;border:1px solid #888;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}a{font-size:13px}#stage{flex:1;min-height:0;position:relative;overflow:hidden;background:black}iframe{border:0;display:block;width:1000px;height:420px;position:absolute;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(var(--scale,1))}footer{text-align:center;font-size:12px;color:#aaa;padding:7px}#stage:fullscreen{width:100vw;height:100vh}#status{font-size:12px;color:#aaa}
</style></head><body><header><button id="fullscreen">Fullscreen</button><button id="mute" disabled>Mute</button><span id="status">Loading player…</span><a href="https://pancu.itch.io/undertale-but-everyone-is-papyrus" target="_blank" rel="noopener">Original game by Pancu</a></header><main id="stage"><iframe id="player" title="Papyrus game" allow="autoplay; fullscreen; gamepad"></iframe></main><footer>Space: start · Enter: interact · Arrow keys: move · Esc: leave fullscreen</footer><script>
(()=>{'use strict';const base=window.PAPYRUS_BASE_URL||new URL('.',location.href).href;const player=document.getElementById('player'),stage=document.getElementById('stage'),status=document.getElementById('status'),mute=document.getElementById('mute');
function fit(){player.style.setProperty('--scale',Math.min(stage.clientWidth/1000,stage.clientHeight/420));}new ResizeObserver(fit).observe(stage);document.addEventListener('fullscreenchange',fit);fit();
document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen();player.focus();}catch(e){status.textContent=e.message;}};
mute.onclick=()=>{player.contentWindow.postMessage({papyrus:true,action:'mute'},'*');player.focus();};
window.addEventListener('message',e=>{if(e.source!==player.contentWindow||!e.data?.papyrus)return;const d=e.data;if('audio'in d)status.textContent=d.audio?'Audio: '+d.audio:'';if(d.playing)mute.disabled=false;if('muted'in d)mute.textContent=d.muted?'Unmute':'Mute';if(d.error)status.textContent=d.error;});
fetch(base+'runner.html').then(r=>{if(!r.ok)throw Error('Player download failed ('+r.status+')');return r.text()}).then(html=>{player.srcdoc=html.replace('__ASSET_BASE__',JSON.stringify(base));status.textContent='';}).catch(e=>status.textContent=e.message);
})();
</script></body></html>
